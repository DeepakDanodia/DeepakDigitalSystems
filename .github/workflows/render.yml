name: Render Remotion Video
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm ci
      - run: npx remotion render Root DDSCommercial out/video.mp4
      - uses: actions/upload-artifact@v3
        with:
          name: DDSCommercial-Video
          path: out/video.mp4
